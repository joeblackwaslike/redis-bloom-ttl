[package]
name = "redis-ttl-bloom"
version = "0.1.0"
edition = "2021"

[dependencies]
redis-module = "2.0"
bloomfilter = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.22"

[dev-dependencies]
# redis = { version = "0.24", features = ["tokio-comp"] }
uuid = { version = "1.0", features = ["v4"] }

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3