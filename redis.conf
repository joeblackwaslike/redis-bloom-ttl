# Redis configuration for TTL Bloom Filter module

# Bind to all interfaces (change for production)
bind 0.0.0.0

# Protected mode off for Docker (enable for production with proper networking)
protected-mode no

# Port
port 6379

# Logging
loglevel notice
logfile ""

# Persistence configuration
# RDB Snapshots
save 900 1
save 300 10
save 60 10000

# RDB file
dbfilename dump.rdb
dir /data

# AOF persistence (recommended for production)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Load the TTL Bloom Filter module
loadmodule /usr/lib/redis/modules/libredis_ttl_bloom.so

# Performance tuning
tcp-backlog 511
timeout 0
tcp-keepalive 300
